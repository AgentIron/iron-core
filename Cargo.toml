[package]
name = "iron-core"
version = "0.1.39"
edition = "2021"
authors = ["Paul Mooring"]
license = "Apache-2.0"
rust-version = "1.96"
description = "Core AgentIron loop, session state, and tool registry"
readme = "README.md"
repository = "https://github.com/AgentIron/iron-core"
exclude = [
    ".opencode/**",
    "openspec/**",
    "tasks.py",
    "Cargo.lock",
]

[dependencies]
iron-providers = "0.2.14"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
futures = "0.3"
pin-project = "1.1.13"
parking_lot = "0.12"

# ACP SDK
agent-client-protocol = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }

# Schema validation
jsonschema = "0.48"

# Plugin dependencies
sha2 = "0.11"
hex = "0.4"
extism = "1.30"
chrono = { version = "0.4", features = ["serde"] }

# Built-in tool dependencies
regex = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
url = "2"

# Ripgrep ecosystem — embedded search engine for glob/grep tools.
# These are the same library crates that power ripgrep itself, providing
# correct glob semantics, .gitignore-aware traversal, and high-performance
# regex search without requiring an external `rg` binary on the host.
ignore = "0.4"
globset = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"

# Config store dependencies
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
directories = "6"
keyring = "4.1.1"
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
base64 = "0.23"
rand = "0.10"
chacha20poly1305 = "0.11"
cfg-if = "1"

# Embedded Python runtime (Monty)
#
monty = { version = "=0.0.19-beta.4", optional = true }
# Monty beta.4 allows an incompatible beta.6 macro release under its semver
# constraint, so consumers must resolve its matching macro crate explicitly.
monty-macros = { version = "=0.0.19-beta.4", optional = true }
# get-size2 0.10.2 changed its compact_str dependency incompatibly with the
# Ruff versions used by Monty. Remove this pin after Monty/Ruff use a compatible graph.
get-size2 = { version = "=0.10.1", optional = true }
# Monty beta.4 exposes num-bigint 0.4 in its public object API.
num-bigint = { version = "0.4", optional = true }
num-traits = { version = "0.2", optional = true }

[features]
default = []
embedded-python = ["monty", "monty-macros", "get-size2", "num-bigint", "num-traits"]

[[bin]]
name = "agent-iron"
path = "src/bin/agent_iron.rs"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
